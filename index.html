<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Manager Pro (Cloud Edition)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React and Babel for In-Browser JSX -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- jsPDF for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

        @media print {
            body { 
                background: white !important; 
                color: black !important;
                margin: 0;
                padding: 0;
            }
            /* Hide the main React application contents during printing completely */
            #root { 
                display: none !important; 
            }
            /* Display ONLY our custom print-root portal */
            #print-root { 
                display: block !important; 
                width: 100% !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                margin: 0 !important;
                padding: 10px !important;
            }
            .no-print { display: none !important; }
        }

        @media screen {
            #print-root {
                display: none;
            }
        }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- ========================================================================= -->
    <!-- 🔴 STEP 1: PASTE YOUR FIREBASE CONFIGURATION HERE 🔴                      -->
    <!-- To sync data across your Phone and PC, replace the placeholder text below -->
    <!-- with your actual Firebase configuration keys from your Firebase Console.  -->
    <!-- ========================================================================= -->
    <script>
        window.SALON_FIREBASE_CONFIG = {
            apiKey: "PASTE_YOUR_API_KEY_HERE",
            authDomain: "PASTE_YOUR_AUTH_DOMAIN_HERE",
            projectId: "PASTE_YOUR_PROJECT_ID_HERE",
            storageBucket: "PASTE_YOUR_STORAGE_BUCKET_HERE",
            messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID_HERE",
            appId: "PASTE_YOUR_APP_ID_HERE"
        };
    </script>

    <!-- React Application mount point -->
    <div id="root"></div>

    <!-- Standalone system print portal mount point -->
    <div id="print-root"></div>

    <!-- Firebase Cloud Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Check if user has replaced the placeholder keys
        const isConfigured = window.SALON_FIREBASE_CONFIG.apiKey && window.SALON_FIREBASE_CONFIG.apiKey !== "PASTE_YOUR_API_KEY_HERE";
        
        window.fbEngine = { isConfigured };

        if (isConfigured) {
            try {
                const app = initializeApp(window.SALON_FIREBASE_CONFIG);
                const db = getFirestore(app);
                window.fbEngine = { isConfigured: true, db, doc, setDoc, getDoc, onSnapshot };
            } catch (e) {
                console.error("Firebase Init Error", e);
            }
        }
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <!-- React Application -->
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Bulletproof Icon Renderer
        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide && window.lucide.icons[name]) {
                    const svg = window.lucide.createElement(window.lucide.icons[name]);
                    svg.setAttribute('width', size);
                    svg.setAttribute('height', size);
                    iconRef.current.innerHTML = '';
                    iconRef.current.appendChild(svg);
                }
            }, [name, size]);
            return <span ref={iconRef} className={`inline-flex items-center justify-center shrink-0 ${className}`} />;
        };

        // --- CLOUD SETUP SCREEN ---
        const NeedsConfigScreen = () => (
            <div className="min-h-screen bg-slate-900 flex items-center justify-center p-6 fade-in">
                <div className="bg-white w-full max-w-2xl rounded-[2.5rem] shadow-2xl p-10 text-center">
                    <div className="bg-purple-100 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6">
                        <Icon name="Cloud" size={40} className="text-purple-600" />
                    </div>
                    <h1 className="text-3xl font-black text-slate-900 mb-4 uppercase tracking-tight">Cloud Sync Required</h1>
                    <p className="text-slate-500 font-bold mb-8">To log in from your phone and PC simultaneously via Netlify, you must link your free database.</p>
                    
                    <div className="bg-slate-50 border border-slate-200 rounded-3xl p-8 text-left space-y-4">
                        <h3 className="font-black text-slate-800 text-lg uppercase tracking-widest border-b border-slate-200 pb-4">How to connect:</h3>
                        <ol className="list-decimal pl-5 text-sm font-bold text-slate-600 space-y-3">
                            <li>Go to <a href="https://console.firebase.google.com/" target="_blank" className="text-purple-600 hover:underline">Firebase Console</a> and create a free project.</li>
                            <li>In the left menu, click <b>Firestore Database</b> and click <b>Create Database</b>.</li>
                            <li>Important: Set your database Rules to <code>allow read, write: if true;</code></li>
                            <li>Go to Project Settings (the gear icon) and add a <b>Web App <code>&lt;/&gt;</code></b>.</li>
                            <li>Copy the <code>firebaseConfig</code> keys it gives you.</li>
                            <li>Open this HTML file in VS Code, find <b>Line 46</b>, and paste your keys there.</li>
                            <li>Upload the updated HTML file to Netlify!</li>
                        </ol>
                    </div>
                </div>
            </div>
        );

        // --- AUTHENTICATION SCREEN ---
        const AuthScreen = ({ authMode, setAuthMode, authError, handleLogin, handleSignup, handleReset, importDbData }) => {
            const [u, setU] = useState(''); const [p, setP] = useState(''); const [s, setS] = useState(''); const [l, setL] = useState('');
            const fileInputRef = useRef(null);
            
            const onSubmit = (e) => {
                e.preventDefault();
                if (authMode === 'login') handleLogin(u, p);
                else if (authMode === 'signup') handleSignup(u, p, s, l);
            };

            const triggerFileImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const parsed = JSON.parse(evt.target.result);
                        const success = importDbData(parsed);
                        if (success) {
                            if (parsed._username && parsed.password) {
                                handleLogin(parsed._username, parsed.password);
                            } else if (parsed.users) {
                                const firstUser = Object.keys(parsed.users)[0];
                                if (firstUser) handleLogin(firstUser, parsed.users[firstUser].password);
                            }
                        }
                    } catch (err) {
                        console.error("Backup recovery error", err);
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center p-6 relative overflow-hidden">
                    <div className="absolute inset-0 overflow-hidden opacity-10 pointer-events-none">
                        <div className="absolute top-0 left-0 w-96 h-96 bg-purple-600 rounded-full blur-[150px] -ml-48 -mt-48" />
                        <div className="absolute bottom-0 right-0 w-96 h-96 bg-blue-600 rounded-full blur-[150px] -mr-48 -mb-48" />
                    </div>

                    <div className="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden relative z-10 fade-in">
                        <form className="p-10 pb-6" onSubmit={onSubmit}>
                            <div className="flex flex-col items-center mb-8">
                                <div className="bg-purple-600 p-4 rounded-[2rem] shadow-xl overflow-hidden flex items-center justify-center w-24 h-24 mb-4 border-4 border-slate-50">
                                    <Icon name="Cloud" size={40} className="text-white" />
                                </div>
                                <h2 className="text-2xl font-black text-slate-900 uppercase tracking-tighter text-center">Salon Cloud</h2>
                                <p className="text-[10px] text-purple-600 font-black uppercase tracking-widest mt-1">Global Access Portal</p>
                            </div>

                            {authError && <div className="bg-red-50 text-red-600 p-4 rounded-2xl mb-6 text-[10px] font-black text-center border border-red-100">{authError}</div>}

                            <div className="space-y-4">
                                <div className="relative">
                                    <Icon name="UserCircle" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300" size={18} />
                                    <input autoFocus type="text" value={u} onChange={e => setU(e.target.value)} required className="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold focus:ring-2 focus:ring-purple-500 outline-none" placeholder="Username" />
                                </div>
                                <div className="relative">
                                    <Icon name="Lock" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300" size={18} />
                                    <input type="password" value={p} onChange={e => setP(e.target.value)} required className="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold focus:ring-2 focus:ring-purple-500 outline-none" placeholder="Password" />
                                </div>
                                
                                {authMode === 'signup' && (
                                    <>
                                        <div className="relative animate-in slide-in-from-top-2">
                                            <Icon name="Image" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300" size={18} />
                                            <input type="text" value={l} onChange={e => setL(e.target.value)} className="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold focus:ring-2 focus:ring-purple-500 outline-none" placeholder="Logo URL (Optional)" />
                                        </div>
                                        <div className="relative animate-in slide-in-from-top-2">
                                            <Icon name="KeyRound" className="absolute left-4 top-1/2 -translate-y-1/2 text-purple-400" size={18} />
                                            <input type="text" value={s} onChange={e => setS(e.target.value)} required className="w-full pl-12 pr-4 py-4 bg-purple-50 border border-purple-100 rounded-2xl font-bold focus:ring-2 focus:ring-purple-500 outline-none" placeholder="Recovery Secret Key" />
                                        </div>
                                    </>
                                )}

                                <button type="submit" className="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-lg hover:bg-slate-800 transition-all shadow-xl active:scale-95">
                                    {authMode === 'login' ? 'Access Dashboard' : 'Enroll Shop to Cloud'}
                                </button>
                            </div>
                            
                            <div className="mt-6 flex flex-col items-center gap-3 border-t border-slate-100 pt-5">
                                {authMode === 'login' ? (
                                    <button type="button" onClick={() => {setAuthMode('signup');}} className="text-purple-600 font-bold text-sm">Create New Shop Account</button>
                                ) : <button type="button" onClick={() => {setAuthMode('login');}} className="text-slate-400 font-bold text-sm">Return to Login</button>}
                            </div>
                        </form>

                        {}
                        {/* Instant Device Switch File Recovery */}
                        <div className="px-10 pb-8 pt-2">
                            <div className="border-2 border-dashed border-slate-200 hover:border-purple-300 bg-slate-50 rounded-2xl p-4 text-center transition-all">
                                <p className="text-[10px] font-black uppercase text-slate-400 tracking-wider mb-2">Switching Device / Backup recovery?</p>
                                <input type="file" ref={fileInputRef} accept=".json" onChange={triggerFileImport} className="hidden" />
                                <button type="button" onClick={() => fileInputRef.current.click()} className="text-xs bg-white border border-slate-200 text-purple-600 font-black px-4 py-2.5 rounded-xl hover:bg-purple-50 transition-colors shadow-sm flex items-center gap-2 mx-auto">
                                    <Icon name="UploadCloud" size={14} /> Restore Credentials File
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- DASHBOARD COMPONENTS ---
        const DashboardView = ({ bills, employees, salonInfo }) => {
            const stats = useMemo(() => {
                const today = new Date().setHours(0, 0, 0, 0);
                const todaysBills = bills.filter(b => b.timestamp >= today);
                return { 
                    dailyRevenue: todaysBills.reduce((acc, curr) => acc + (Number(curr.total) || 0), 0), 
                    dailyCustomers: todaysBills.length, 
                    activeStaff: employees.filter(e => e.status === 'active').length 
                };
            }, [bills, employees]);

            const dashboardImg = salonInfo.dashboardImageUrl || "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&q=80&w=1600";

            return (
                <div className="space-y-8 fade-in">
                    <div className="relative h-[400px] w-full rounded-[2.5rem] overflow-hidden shadow-2xl group border-4 border-white bg-slate-900">
                        <div className="absolute inset-0 bg-gradient-to-r from-slate-900 via-slate-900/60 to-transparent z-10" />
                        <img src={dashboardImg} className="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700 opacity-60" />
                        <div className="absolute inset-0 z-20 flex flex-col justify-center px-10 text-white">
                            <div className="flex items-center gap-6 mb-4">
                                <div className="bg-white/10 backdrop-blur-md p-5 rounded-3xl border border-white/20 overflow-hidden flex items-center justify-center w-24 h-24 shrink-0 shadow-2xl">
                                    {salonInfo.logoUrl ? <img src={salonInfo.logoUrl} className="w-full h-full object-contain" /> : <Icon name="Scissors" size={40} className="text-purple-400" />}
                                </div>
                                <div>
                                    <h2 className="text-5xl font-black tracking-tighter drop-shadow-md">{salonInfo.name || 'Your Salon Name'}</h2>
                                    <div className="flex flex-wrap items-center gap-x-8 gap-y-2 mt-3 text-slate-300 font-bold uppercase text-xs tracking-widest drop-shadow-md">
                                        <span className="flex items-center gap-2"><Icon name="Phone" size={14} className="text-purple-400" /> {salonInfo.mobile || 'Set phone'}</span>
                                        <span className="flex items-center gap-2"><Icon name="MapPin" size={14} className="text-purple-400" /> {salonInfo.address || 'Set address'}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 flex items-center gap-4"><div className="bg-emerald-100 p-4 rounded-2xl text-emerald-600 shadow-inner"><Icon name="TrendingUp" size={28} /></div><div><p className="text-slate-400 text-xs font-black uppercase tracking-widest">Daily Revenue</p><p className="text-3xl font-black text-slate-800">₹{stats.dailyRevenue.toLocaleString()}</p></div></div>
                        <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 flex items-center gap-4"><div className="bg-blue-100 p-4 rounded-2xl text-blue-600 shadow-inner"><Icon name="Users" size={28} /></div><div><p className="text-slate-400 text-xs font-black uppercase tracking-widest">Today's Clients</p><p className="text-3xl font-black text-slate-800">{stats.dailyCustomers}</p></div></div>
                        <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 flex items-center gap-4"><div className="bg-purple-100 p-4 rounded-2xl text-purple-600 shadow-inner"><Icon name="Scissors" size={28} /></div><div><p className="text-slate-400 text-xs font-black uppercase tracking-widest">Service Team</p><p className="text-3xl font-black text-slate-800">{stats.activeStaff} Staff</p></div></div>
                    </div>
                </div>
            );
        };

        const BillingView = ({ employees, services, createBill, salonInfo, currentUser, triggerAlert }) => {
            const [billForm, setBillForm] = useState({ customerName: '', employeeId: '', customerPhone: '', taxType: 'WITHOUT_GST', paymentMode: 'CASH', selectedServices: [], customGstPercent: salonInfo.defaultGstPercent || 18 });
            const [search, setSearch] = useState('');
            const activeEmployees = employees.filter(e => e.status === 'active');
            const subtotal = billForm.selectedServices.reduce((acc, curr) => acc + (Number(curr.price) || 0), 0);
            const tax = billForm.taxType === 'WITH_GST' ? subtotal * (Number(billForm.customGstPercent) / 100) : 0;
            const total = subtotal + tax;

            const addToCart = (s) => setBillForm(prev => ({ ...prev, selectedServices: [...prev.selectedServices, { ...s, cartId: Date.now().toString() + Math.random() }] }));
            const removeFromCart = (cartId) => setBillForm(prev => ({ ...prev, selectedServices: prev.selectedServices.filter(x => x.cartId !== cartId) }));

            return (
                <form className="grid grid-cols-1 lg:grid-cols-3 gap-8 fade-in" onSubmit={(e) => { 
                    e.preventDefault(); 
                    if (!billForm.selectedServices.length) return triggerAlert("Please select at least 1 service to settle a bill."); 
                    createBill({ ...billForm, subtotal, tax, total }); 
                    setBillForm({ customerName: '', employeeId: '', customerPhone: '', taxType: 'WITHOUT_GST', paymentMode: 'CASH', selectedServices: [], customGstPercent: salonInfo.defaultGstPercent || 18 }); 
                }}>
                    <div className="lg:col-span-2 space-y-6">
                        <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                            <h3 className="font-black text-slate-800 mb-8 flex items-center gap-3 text-lg uppercase tracking-tight"><Icon name="UserPlus" className="text-purple-500" size={24} /> Client Entry (Optional)</h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Customer Name</label><input type="text" autoFocus value={billForm.customerName} onChange={e => setBillForm({...billForm, customerName: e.target.value})} className="w-full px-5 py-4 border border-slate-200 rounded-2xl bg-slate-50 font-bold focus:ring-2 focus:ring-purple-500 outline-none" placeholder="Walk-in Client" /></div>
                                <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">WhatsApp No.</label><input type="text" value={billForm.customerPhone} onChange={e => setBillForm({...billForm, customerPhone: e.target.value})} className="w-full px-5 py-4 border border-slate-200 rounded-2xl bg-slate-50 font-bold focus:ring-2 focus:ring-purple-500 outline-none" placeholder="+91..." /></div>
                                <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Stylist</label><select value={billForm.employeeId} onChange={e => setBillForm({...billForm, employeeId: e.target.value})} className="w-full px-5 py-4 border border-slate-200 rounded-2xl bg-slate-50 font-bold outline-none focus:ring-2 focus:ring-purple-500"><option value="">Unassigned</option>{activeEmployees.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}</select></div>
                            </div>
                        </div>
                        <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                            <div className="flex justify-between items-center mb-8"><h3 className="font-black text-slate-800 flex items-center gap-3 text-lg uppercase tracking-tight"><Icon name="Scissors" className="text-purple-500" size={24} /> Add Services</h3><div className="relative w-64"><Icon name="Search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" size={18} /><input type="text" placeholder="Search menu..." value={search} onChange={e => setSearch(e.target.value)} className="w-full pl-12 pr-6 py-3 text-sm border border-slate-200 rounded-2xl bg-slate-50 font-bold focus:ring-2 focus:ring-purple-500 outline-none" /></div></div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[450px] overflow-y-auto pr-2 custom-scrollbar">
                                {services.filter(s => (s.name || '').toLowerCase().includes(search.toLowerCase())).map(service => (
                                    <button type="button" key={service.id} onClick={() => addToCart(service)} className={`flex items-center justify-between p-5 rounded-[1.5rem] border-2 transition-all hover:bg-slate-50 border-slate-100 hover:border-purple-200 group`}>
                                        <div className="text-left"><p className="font-black text-lg text-slate-800 group-hover:text-purple-700 transition-colors">{service.name}</p><p className="text-xs font-black text-slate-400 uppercase mt-1">₹{service.price}</p></div>
                                        <div className="p-2 rounded-xl bg-purple-50 text-purple-600"><Icon name="Plus" size={18} /></div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                    <div className="bg-slate-900 text-white p-8 rounded-[2.5rem] shadow-2xl h-fit sticky top-6 border-4 border-slate-800 overflow-hidden">
                        <div className="absolute top-0 right-0 w-40 h-40 bg-purple-600/10 rounded-full blur-[80px] -mr-20 -mt-20" />
                        <h3 className="font-black text-2xl mb-10 flex justify-between uppercase tracking-tight">Summary <span className="text-[10px] bg-emerald-500 text-white px-3 py-1 rounded-full">{currentUser}</span></h3>
                        
                        <div className="space-y-4 mb-8 max-h-48 overflow-y-auto px-1 custom-scrollbar">
                            {billForm.selectedServices.map(s => (
                                <div key={s.cartId} className="flex justify-between items-center group font-bold text-slate-400">
                                    <span>{s.name}</span>
                                    <div className="flex items-center gap-3">
                                        <span className="text-white">₹{s.price}</span>
                                        <button type="button" onClick={() => removeFromCart(s.cartId)} className="text-red-400 hover:text-red-300 bg-red-400/10 p-1.5 rounded-lg transition-colors"><Icon name="X" size={14} /></button>
                                    </div>
                                </div>
                            ))}
                            {!billForm.selectedServices.length && <div className="text-slate-600 text-xs font-black uppercase tracking-widest text-center py-4">No items added</div>}
                        </div>

                        <div className="border-t border-white/10 pt-8 space-y-6">
                            <div className="grid grid-cols-2 gap-3"><button type="button" onClick={() => setBillForm({...billForm, paymentMode: 'CASH'})} className={`py-4 rounded-2xl border-2 font-black transition-all flex items-center justify-center gap-2 ${billForm.paymentMode === 'CASH' ? 'bg-white text-slate-900 border-white' : 'bg-white/5 text-slate-400 border-white/5'}`}><Icon name="Banknote" size={18} /> Cash</button><button type="button" onClick={() => setBillForm({...billForm, paymentMode: 'ONLINE'})} className={`py-4 rounded-2xl border-2 font-black transition-all flex items-center justify-center gap-2 ${billForm.paymentMode === 'ONLINE' ? 'bg-purple-600 text-white border-purple-600' : 'bg-white/5 text-slate-400 border-white/5'}`}><Icon name="Wallet" size={18} /> Online</button></div>
                            <div className="flex bg-white/5 p-2 rounded-2xl border border-white/5"><button type="button" onClick={() => setBillForm({...billForm, taxType: 'WITHOUT_GST'})} className={`flex-1 py-3 text-xs rounded-xl font-black transition-all ${billForm.taxType === 'WITHOUT_GST' ? 'bg-white text-slate-900' : 'text-slate-400'}`}>PLAIN</button><button type="button" onClick={() => setBillForm({...billForm, taxType: 'WITH_GST'})} className={`flex-1 py-3 text-xs rounded-xl font-black transition-all ${billForm.taxType === 'WITH_GST' ? 'bg-purple-600 text-white' : 'text-slate-400'}`}>GST</button></div>

        // --- REVENUE HISTORY & STATS VIEW ---
        const HistoryView = ({ bills, employees, services, triggerAlert }) => {
            const [start, setStart] = useState(''); const [end, setEnd] = useState(''); const [payFilter, setPayFilter] = useState('ALL');

            const filtered = useMemo(() => bills.filter(b => { 
                const t = b.timestamp; 
                const matchesStart = start ? t >= new Date(start).getTime() : true; 
                const matchesEnd = end ? t <= new Date(end).setHours(23,59,59,999) : true; 
                const matchesPay = payFilter === 'ALL' ? true : b.paymentMode === payFilter;
                return matchesStart && matchesEnd && matchesPay; 
            }), [bills, start, end, payFilter]);

            const revenue = useMemo(() => filtered.reduce((acc, c) => ({ total: acc.total + Number(c.total), cash: acc.cash + (c.paymentMode === 'CASH' ? Number(c.total) : 0), online: acc.online + (c.paymentMode === 'ONLINE' ? Number(c.total) : 0), count: acc.count + 1 }), { total: 0, cash: 0, online: 0, count: 0 }), [filtered]);

            const downloadPDF = () => {
                if (!window.jspdf) return triggerAlert("PDF engine loading. Please wait a moment.");
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.setFontSize(20); doc.setTextColor(15, 23, 42); doc.text("Salon Revenue Statement", 14, 22);
                doc.setFontSize(10); doc.setTextColor(100, 116, 139); 
                let dateText = "Period: All Time";
                if (start && end) dateText = `Period: ${start} to ${end}`; else if (start) dateText = `Period: From ${start}`; else if (end) dateText = `Period: Until ${end}`;
                doc.text(dateText, 14, 30); doc.text(`Payment Filter: ${payFilter}`, 14, 36);

                const tableRows = filtered.map(b => [b.dateString.split(',')[0], b.invoiceNo, b.customerName || 'Walk-in', employees.find(e => e.id === b.employeeId)?.name || 'Admin', b.paymentMode, `Rs ${Number(b.total).toFixed(2)}`]);
                doc.autoTable({ head: [["Date", "Invoice", "Client", "Stylist", "Mode", "Amount"]], body: tableRows, startY: 42, theme: 'grid', styles: { fontSize: 9, cellPadding: 3 }, headStyles: { fillColor: [147, 51, 234], textColor: [255, 255, 255], fontStyle: 'bold' } });

                const finalY = doc.lastAutoTable.finalY || 42;
                doc.setFillColor(241, 245, 249); doc.roundedRect(14, finalY + 10, 182, 35, 3, 3, 'F');
                doc.setFontSize(12); doc.setTextColor(15, 23, 42); doc.text("Statement Summary", 20, finalY + 18);
                doc.setFontSize(10); doc.text(`Total Bills: ${revenue.count}`, 20, finalY + 26); doc.text(`Cash: Rs ${revenue.cash.toLocaleString()}  |  Online: Rs ${revenue.online.toLocaleString()}`, 20, finalY + 32);
                doc.setFontSize(14); doc.setTextColor(147, 51, 234); doc.text(`Total Revenue: Rs ${revenue.total.toLocaleString()}`, 110, finalY + 30);

                let filename = `Revenue_Statement_${Date.now()}.pdf`;
                if (start && end) filename = `Revenue_Statement_${start}_to_${end}.pdf`; else if (start) filename = `Revenue_Statement_From_${start}.pdf`; else if (end) filename = `Revenue_Statement_Until_${end}.pdf`; else filename = `Revenue_Statement_All_Time.pdf`;
                doc.save(filename);
            };

            return (

                            <button onClick={downloadPDF} className="px-5 py-3 bg-slate-900 text-white rounded-2xl hover:bg-slate-800 transition-all font-black text-sm flex items-center gap-2"><Icon name="Download" size={16}/> Export PDF</button>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 no-print"><div className="bg-slate-900 text-white p-8 rounded-[2.5rem] border-4 border-slate-800"><p className="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Total Period Revenue</p><p className="text-4xl font-black tracking-tighter">₹{revenue.total.toLocaleString()}</p></div><div className="bg-white p-8 rounded-[2.5rem] border border-slate-100 flex flex-col justify-center"><p className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">Cash Total</p><p className="text-2xl font-black text-slate-800">₹{revenue.cash.toLocaleString()}</p></div><div className="bg-white p-8 rounded-[2.5rem] border border-slate-100 flex flex-col justify-center"><p className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">Online Total</p><p className="text-2xl font-black text-purple-600">₹{revenue.online.toLocaleString()}</p></div><div className="bg-purple-50 p-8 rounded-[2.5rem] border border-purple-100 flex flex-col justify-center"><p className="text-[10px] font-black uppercase tracking-widest text-purple-400 mb-2">Bills Settled</p><p className="text-2xl font-black text-purple-800">{revenue.count}</p></div></div>

        // --- CAMPAIGNS & MARKETING STUDIO ---
        const CampaignsView = ({ salonInfo, triggerAlert }) => {
            const [numbers, setNumbers] = useState('');
            const [queue, setQueue] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            
            const [title, setTitle] = useState('FESTIVE SALE!');
            const [subtitle, setSubtitle] = useState('Flat 50% Off on Premium Services');
            const [offers, setOffers] = useState([
                { id: 1, text: 'Premium Haircut: ₹800 ➔ ₹399' },
                { id: 2, text: 'Bridal Makeup: ₹5000 ➔ ₹2499' },
                { id: 3, text: 'Advanced Hair Spa: ₹1500 ➔ ₹799' }
            ]);
            const [themeMode, setThemeMode] = useState('neon'); 
            const [customBg, setCustomBg] = useState('');
            const [textColor, setTextColor] = useState('white');
            const canvasRef = useRef(null);

            const addOffer = () => {
                if (offers.length >= 10) return triggerAlert("Max 10 offers");
                setOffers([...offers, { id: Date.now(), text: '' }]);
            };
            const updateOffer = (id, val) => setOffers(offers.map(o => o.id === id ? { ...o, text: val } : o));
            const removeOffer = (id) => setOffers(offers.filter(o => o.id !== id));

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                canvas.width = 1080; canvas.height = 1080;
                
                const themeConfig = {
                     neon: { bg: ['#2e0656', '#a855f7'], text: 'white' },
                     pearl: { bg: ['#f8fafc', '#e2e8f0'], text: 'dark' },
                     gold: { bg: ['#020617', '#ca8a04'], text: 'white' },
                     ocean: { bg: ['#0f172a', '#06b6d4'], text: 'white' },
                     sunset: { bg: ['#4c0519', '#f97316'], text: 'white' },
                     silk: { bg: ['#0f172a', '#64748b'], text: 'white' },
                     ruby: { bg: ['#450a0a', '#e11d48'], text: 'white' },
                     aurora: { bg: ['#020617', '#10b981'], text: 'white' }
                };

                const drawContent = (isDarkText) => {
                    ctx.fillStyle = isDarkText ? 'rgba(255, 255, 255, 0.85)' : 'rgba(15, 23, 42, 0.85)';
                    const boxX = 80, boxY = 270, boxW = 920, boxH = 580, r = 40;
                    ctx.beginPath();
                    ctx.moveTo(boxX + r, boxY); ctx.lineTo(boxX + boxW - r, boxY);
                    ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + r);
                    ctx.lineTo(boxX + boxW, boxY + boxH - r);
                    ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - r, boxY + boxH);
                    ctx.lineTo(boxX + r, boxY + boxH);
                    ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - r);
                    ctx.lineTo(boxX, boxY + r); ctx.quadraticCurveTo(boxX, boxY, boxX + r, boxY);
                    ctx.closePath(); ctx.fill();

                    ctx.strokeStyle = isDarkText ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.15)';
                    ctx.lineWidth = 2; ctx.stroke();

                    ctx.textAlign = 'center';
                    ctx.fillStyle = isDarkText ? '#0f172a' : '#ffffff';
                    ctx.shadowColor = 'rgba(0,0,0,0.6)';
                    ctx.shadowBlur = isDarkText ? 0 : 15;
                    ctx.font = '900 85px sans-serif'; 
                    ctx.fillText(title.toUpperCase(), 540, 150);
                    ctx.shadowBlur = 0; 

                    ctx.font = '900 38px sans-serif'; 
                    ctx.fillStyle = isDarkText ? '#d97706' : '#fde047';
                    ctx.fillText(subtitle.toUpperCase(), 540, 220);

                    ctx.fillStyle = isDarkText ? '#1e293b' : '#f8fafc';
                    ctx.font = '700 34px sans-serif';
                    const startY = 350; const rowH = 75;

                    if (offers.length <= 5) {
                        offers.forEach((o, i) => ctx.fillText(`✦  ${o.text}`, 540, startY + (i * rowH)));
                    } else {
                        ctx.textAlign = 'left';
                        offers.forEach((o, i) => {
                            const colX = i % 2 === 0 ? 120 : 560;
                            const rowY = Math.floor(i / 2);
                            ctx.fillText(`✦  ${o.text}`, colX, startY + (rowY * rowH));
                        });
                        ctx.textAlign = 'center';
                    }

                    const footerY = 970;
                    ctx.fillStyle = isDarkText ? '#d97706' : '#fde047';
                    ctx.font = '900 46px sans-serif'; 
                    ctx.fillText(salonInfo.name.toUpperCase() || 'SALON PRO', 540, footerY);
                    
                    ctx.fillStyle = isDarkText ? '#475569' : '#e2e8f0';
                    ctx.font = '700 28px sans-serif'; 
                    ctx.fillText(`Book Appointment Today: ${salonInfo.mobile || 'Contact Us'}`, 540, footerY + 50);
                };

                if (themeMode === 'custom' && customBg) {
                    const img = new window.Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => {
                        const scale = Math.max(1080 / img.width, 1080 / img.height);
                        const x = (1080 / 2) - (img.width / 2) * scale;
                        const y = (1080 / 2) - (img.height / 2) * scale;
                        ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
                        ctx.fillStyle = textColor === 'white' ? 'rgba(0,0,0,0.5)' : 'rgba(255,255,255,0.6)';
                        ctx.fillRect(0,0,1080,1080);
                        ctx.strokeStyle = textColor === 'white' ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.3)';
                        ctx.lineWidth = 3; ctx.strokeRect(40, 40, 1000, 1000);
                        ctx.lineWidth = 1; ctx.strokeRect(52, 52, 976, 976);
                        drawContent(textColor === 'dark');
                    };
                    img.onerror = () => {
                        ctx.fillStyle = '#1e293b'; ctx.fillRect(0,0,1080,1080);
                        ctx.fillStyle = 'white'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center';
                        ctx.fillText('Custom Image Failed to Load.', 540, 540);
                    };
                    img.src = customBg;
                } else {
                    const tc = themeConfig[themeMode] || themeConfig.neon;
                    const grad = ctx.createLinearGradient(0, 0, 1080, 1080);
                    grad.addColorStop(0, tc.bg[0]); grad.addColorStop(1, tc.bg[1]);
                    ctx.fillStyle = grad; ctx.fillRect(0, 0, 1080, 1080);
                    ctx.strokeStyle = tc.text === 'dark' ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.2)';
                    ctx.lineWidth = 3; ctx.strokeRect(40, 40, 1000, 1000);
                    ctx.lineWidth = 1; ctx.strokeRect(52, 52, 976, 976);
                    drawContent(tc.text === 'dark');
                }
            }, [title, subtitle, offers, themeMode, customBg, textColor, salonInfo.name, salonInfo.mobile]);

            const downloadPoster = () => {
                const url = canvasRef.current.toDataURL("image/png");
                const link = document.createElement('a');
                link.download = `Salon_Offer_${Date.now()}.png`; link.href = url; link.click();
            };

            const generateQueue = () => {
                const parsed = numbers.split(/[\s,\n]+/).map(n => n.replace(/\D/g, '')).filter(n => n.length >= 10);
                if (!parsed.length) return triggerAlert("No valid phone numbers found.");
                setQueue(parsed); setCurrentIndex(0); 
            };

            const sendNext = () => {
                if (currentIndex >= queue.length) return;
                const num = queue[currentIndex];
                let msg = `*${title}*\n_${subtitle}_\n\n*Special Offers:*\n`;
                offers.forEach(o => { msg += `✅ ${o.text}\n`; });
                msg += `\n*Book Now:* ${salonInfo.mobile}\n*${salonInfo.name}*`;

                const url = `https://web.whatsapp.com/send?phone=${num}&text=${encodeURIComponent(msg)}`;
                window.open(url, 'whatsapp_campaign_window'); 
                setCurrentIndex(prev => prev + 1);
            };

            return (
                <div className="grid grid-cols-1 xl:grid-cols-2 gap-8 fade-in">
                    <div className="bg-white p-10 rounded-[3rem] border border-slate-100 shadow-sm space-y-8 flex flex-col h-[850px] overflow-y-auto custom-scrollbar">
                        <h2 className="text-3xl font-black text-slate-800 uppercase tracking-tighter flex items-center gap-3"><Icon name="Image" className="text-purple-500" size={32} /> Marketing Studio</h2>
                        <div className="space-y-6">
                            <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Offer Headline</label><input type="text" value={title} onChange={e=>setTitle(e.target.value)} className="w-full px-5 py-4 border border-slate-200 rounded-2xl bg-slate-50 font-black text-lg focus:ring-2 focus:ring-purple-500 outline-none" /></div>
                            <div><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Subtitle</label><input type="text" value={subtitle} onChange={e=>setSubtitle(e.target.value)} className="w-full px-5 py-4 border border-slate-200 rounded-2xl bg-slate-50 font-bold focus:ring-2 focus:ring-purple-500 outline-none" /></div>
                            
                            <div className="bg-slate-50 p-6 rounded-3xl border border-slate-100">
                                <div className="flex justify-between items-center mb-4"><label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest">Service Offers (Max 10)</label><button onClick={addOffer} className="text-xs font-black text-purple-600 flex items-center gap-1 hover:underline"><Icon name="Plus" size={14}/> Add Item</button></div>
                                <div className="space-y-3 max-h-48 overflow-y-auto custom-scrollbar pr-2">
                                    {offers.map(o => (
                                        <div key={o.id} className="flex gap-2"><input type="text" value={o.text} onChange={e => updateOffer(o.id, e.target.value)} placeholder="e.g. Haircut: ₹500 ➔ ₹250" className="flex-1 px-4 py-3 border border-slate-200 rounded-xl font-bold focus:ring-2 focus:ring-purple-500 outline-none" /><button onClick={() => removeOffer(o.id)} className="bg-red-50 text-red-500 p-3 rounded-xl hover:bg-red-100"><Icon name="X" size={16}/></button></div>
                                    ))}
                                </div>
                            </div>

                            <div className="space-y-4">
                                <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest">Poster Theme</label>
                                <div className="flex flex-wrap gap-2">
                                    {['neon', 'pearl', 'gold', 'ocean', 'sunset', 'silk', 'ruby', 'aurora'].map(t => (
                                        <button key={t} onClick={() => {setThemeMode(t); setTextColor(t==='pearl' ? 'dark' : 'white');}} className={`flex-1 min-w-[70px] py-3 rounded-xl font-black uppercase text-[10px] tracking-widest border-2 transition-all ${themeMode === t ? 'border-purple-600 bg-purple-50 text-purple-700' : 'border-slate-100 text-slate-400 hover:border-slate-200'}`}>{t}</button>
                                    ))}
                                    <button onClick={() => setThemeMode('custom')} className={`p-3 flex-1 min-w-[70px] rounded-xl border-2 transition-all flex items-center justify-center ${themeMode === 'custom' ? 'border-purple-600 bg-purple-50 text-purple-700' : 'border-slate-100 text-slate-400 hover:border-slate-200'}`} title="Custom Image URL"><Icon name="ImageIcon" size={16}/></button>
                                </div>
                                {themeMode === 'custom' && (
                                    <div className="space-y-3 animate-in fade-in">
                                        <input type="text" value={customBg} onChange={e=>setCustomBg(e.target.value)} placeholder="Paste Custom Image URL..." className="w-full px-5 py-4 border border-slate-200 rounded-2xl bg-slate-50 font-bold focus:ring-2 focus:ring-purple-500 outline-none" />
                                        <div className="flex gap-2"><button onClick={() => setTextColor('white')} className={`flex-1 py-2 rounded-lg font-black text-[10px] uppercase border ${textColor === 'white' ? 'bg-slate-800 text-white' : 'bg-white text-slate-400'}`}>Light Text</button><button onClick={() => setTextColor('dark')} className={`flex-1 py-2 rounded-lg font-black text-[10px] uppercase border ${textColor === 'dark' ? 'bg-slate-200 text-slate-800' : 'bg-white text-slate-400'}`}>Dark Text</button></div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="space-y-8 flex flex-col h-[850px]">
                        <div className="bg-slate-900 p-8 rounded-[3rem] flex-1 flex flex-col items-center justify-center relative shadow-2xl overflow-hidden group">
                            <div className="absolute top-0 right-0 w-64 h-64 bg-purple-600/20 rounded-full blur-[100px] -mr-32 -mt-32" />
                            <canvas ref={canvasRef} className="w-[300px] h-[300px] xl:w-[400px] xl:h-[400px] object-cover rounded-3xl border-8 border-white/10 shadow-2xl z-10 transition-transform group-hover:scale-105" />
                            <button onClick={downloadPoster} className="mt-8 bg-purple-600 text-white px-10 py-5 rounded-2xl font-black text-lg hover:bg-purple-500 transition-all shadow-xl shadow-purple-900/50 flex items-center gap-3 z-10 active:scale-95"><Icon name="Download" /> Download HD Poster</button>
                        </div>

                        <div className="bg-emerald-50 p-8 rounded-[3rem] border border-emerald-100 shadow-sm shrink-0">
                            <h3 className="font-black text-emerald-800 mb-4 flex items-center gap-2 uppercase tracking-tighter"><Icon name="MessageCircle" /> WhatsApp Smart Queue</h3>
                            {queue.length === 0 ? (
                                <div className="space-y-4">
                                    <textarea value={numbers} onChange={e=>setNumbers(e.target.value)} rows="3" className="w-full px-5 py-4 border border-emerald-200 rounded-2xl bg-white font-bold focus:ring-2 focus:ring-emerald-500 outline-none placeholder:text-emerald-300" placeholder="Paste Contact Numbers here (separated by spaces or commas)..." />
                                    <button onClick={generateQueue} className="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black hover:bg-emerald-500 shadow-lg">Load Contact Queue</button>
                                </div>
                            ) : (
                                <div className="text-center space-y-4 animate-in zoom-in-95">
                                    <div className="text-emerald-600 font-black text-4xl">{currentIndex} / {queue.length}</div>
                                    {currentIndex < queue.length ? (
                                        <>
                                            <p className="text-xs font-bold text-emerald-700">Open chat, paste downloaded poster (Ctrl+V), and hit send!</p>
                                            <button onClick={sendNext} className="w-full bg-emerald-500 text-white py-5 rounded-2xl font-black text-xl hover:bg-emerald-400 shadow-xl flex justify-center items-center gap-3 active:scale-95"><Icon name="Send" size={24} /> Pop Open Chat</button>
                                        </>
                                    ) : (
                                        <button onClick={() => {setQueue([]); setNumbers('');}} className="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-lg hover:bg-slate-800">Done! Start New Campaign</button>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const EmployeesView = ({ employees, addEmployee, deleteEmployee, updateEmployee, triggerConfirm }) => {

                                            <input type="text" value={editForm.phone} onChange={e => setEditForm({...editForm, phone: e.target.value})} className="w-full px-4 py-3 border border-purple-200 rounded-xl font-bold focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Phone..." />

                                            <button onClick={() => setEditingId(null)} className="flex-1 bg-white text-slate-600 hover:bg-slate-100 py-3 rounded-xl font-black border border-slate-200 transition-colors">Cancel</button>
                                        </div>
                                    </div>

                            return (
                                <div key={emp.id} className="bg-white p-8 rounded-[2.5rem] border border-slate-100 relative group overflow-hidden hover:shadow-2xl transition-all">
                                    <div className="w-16 h-16 bg-purple-600 rounded-2xl flex items-center justify-center text-white font-black text-2xl mb-6 shadow-md">{(emp.name || 'E')[0]}</div>
                                    <h3 className="text-xl font-black text-slate-800 mb-1">{emp.name}</h3>
                                    <div className="flex items-center gap-2 text-slate-400 text-xs font-bold mb-6"><Icon name="Phone" size={12} /> {emp.phone || 'No phone added'}</div>
                                    <div className="grid grid-cols-2 gap-6 pt-6 border-t border-slate-50">
                                        <div><p className="text-[10px] text-slate-400 font-black uppercase mb-1">Clients</p><p className="text-xl font-black text-slate-800">{emp.customersManaged || 0}</p></div>
                                        <div><p className="text-[10px] text-slate-400 font-black uppercase mb-1">Rev</p><p className="text-xl font-black text-emerald-600">₹{(emp.totalRevenue || 0).toLocaleString()}</p></div>
                                    </div>
                                    <div className="absolute top-8 right-8 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <button onClick={() => { setEditingId(emp.id); setEditForm({ name: emp.name, phone: emp.phone || '' }); }} className="text-slate-400 hover:text-purple-600 transition-colors bg-slate-50 hover:bg-purple-50 p-3 rounded-xl"><Icon name="Edit" size={18} /></button>
                                        <button onClick={() => { triggerConfirm('Move this staff member to trash?', () => deleteEmployee(emp.id)); }} className="text-slate-400 hover:text-red-500 transition-colors bg-slate-50 hover:bg-red-50 p-3 rounded-xl"><Icon name="Trash2" size={18} /></button>
                                    </div>
                                </div>

                        {activeStaff.length === 0 && <div className="col-span-full py-20 text-center bg-white rounded-[3rem] border-4 border-dashed border-slate-100 text-slate-400 font-black uppercase tracking-widest">No Active Staff</div>}
                    </div>
                </div>
            );
        };

        const ServicesView = ({ services, addService, updateService, deleteService, triggerConfirm }) => {
            const [showAdd, setShowAdd] = useState(false);
            const [newService, setNewService] = useState({ name: '', price: '' });
            const [search, setSearch] = useState('');
            const [editingId, setEditingId] = useState(null);

            return (

                        <form className="bg-slate-900 text-white p-10 rounded-[2.5rem] flex flex-col md:flex-row gap-6 items-end shadow-2xl animate-in slide-in-from-top-4" onSubmit={e => { e.preventDefault(); addService(newService.name, newService.price); setNewService({name:'', price:''}); setShowAdd(false); }}>

                            </tbody>
                        </table>
                    </div>
                </div>

        const SettingsView = ({ salonInfo, handleSaveSalon, exportDbData, triggerConfirm, resetDatabase }) => {
            const [saved, setSaved] = useState(false);
            const [info, setInfo] = useState({ ...salonInfo, slideshowImages: salonInfo.slideshowImages || [] });
            const [newImage, setNewImage] = useState('');

                        </div>

                            <div><label className="block text-xs font-black text-slate-400 uppercase mb-3">GST No.</label><input type="text" value={info.gst || ''} onChange={e => setInfo({...info, gst: e.target.value})} className="w-full px-6 py-4 border border-slate-200 rounded-2xl bg-slate-50 font-black uppercase focus:ring-2 focus:ring-purple-500 outline-none" /></div>
                            <div><label className="block text-xs font-black text-slate-400 uppercase mb-3">Default GST %</label><input type="number" value={info.defaultGstPercent || 18} onChange={e => setInfo({...info, defaultGstPercent: e.target.value})} className="w-full px-6 py-4 border border-slate-200 rounded-2xl bg-slate-50 font-black focus:ring-2 focus:ring-purple-500 outline-none" /></div>

                        <div className="mt-10 border-t border-slate-100 pt-10">
