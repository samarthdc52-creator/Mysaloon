                                        <button type="button" onClick={() => removeImage(idx)} className="absolute top-2 right-2 bg-red-500 text-white p-2 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="Trash2" size={14} /></button>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <button type="submit" className={`px-12 py-5 rounded-[1.5rem] font-black mt-10 transition-all flex items-center gap-3 ${saved ? 'bg-emerald-500 text-white shadow-emerald-500/50 shadow-xl' : 'bg-slate-900 text-white hover:bg-slate-800'}`}>
                            <Icon name={saved ? "CheckCircle2" : "Save"} className={saved ? "text-white" : "text-purple-400"} /> {saved ? 'Profile Saved' : 'Save Profile'}
                        </button>
                    </form>

                    <div className="max-w-4xl bg-white p-12 rounded-[3rem] border border-slate-100 shadow-sm grid grid-cols-1 md:grid-cols-2 gap-12">
                        <div>
                            <h2 className="text-2xl font-black text-slate-800 mb-4 flex items-center gap-3 uppercase tracking-tight"><Icon name="Database" className="text-blue-500" size={28} /> Data Backup</h2>
                            <p className="text-xs font-bold text-slate-400 mb-8 leading-relaxed">Download your secure database to backup your files, or import an existing backup.</p>
                            <div className="flex gap-4">
                                <button onClick={exportDbData} className="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black hover:bg-blue-500 transition-all flex justify-center items-center gap-2 shadow-lg shadow-blue-500/30"><Icon name="Download" size={18} /> Export</button>
                                <input type="file" accept=".json" className="hidden" ref={fileInputRef} onChange={e => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (evt) => { try { const parsed = JSON.parse(evt.target.result); } catch(err) { } }; reader.readAsText(file); }} />
                                <button type="button" onClick={() => fileInputRef.current.click()} className="flex-1 bg-white border-2 border-slate-200 text-slate-600 py-4 rounded-2xl font-black hover:bg-slate-50 transition-all flex justify-center items-center gap-2"><Icon name="Upload" size={18} /> Import</button>
                            </div>
                        </div>
                        <div>
                            <h2 className="text-2xl font-black text-slate-800 mb-4 flex items-center gap-3 uppercase tracking-tight"><Icon name="AlertTriangle" className="text-red-500" size={28} /> Danger Zone</h2>
                            <p className="text-xs font-bold text-slate-400 mb-8 leading-relaxed">Factory reset your data. This permanently wipes your shop but keeps your login.</p>
                            <div className="flex gap-4">
                                <button type="button" onClick={() => triggerConfirm('Reset ALL bills and staff stats to zero? Login and Settings will be kept.', resetDatabase)} className="flex-1 bg-red-100 text-red-600 py-4 rounded-2xl font-black hover:bg-red-200 transition-all flex justify-center items-center gap-2"><Icon name="Trash2" size={18} /> Factory Reset</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const TrashView = ({ employees, restoreEmployee }) => {
            const deletedStaff = employees.filter(e => e.status === 'deleted');
            return (
                <div className="space-y-6 fade-in">
                    <h2 className="text-3xl font-black text-slate-800 uppercase tracking-tight">Inactive Staff Archive</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        {deletedStaff.map(emp => (
                            <div key={emp.id} className="bg-white p-8 rounded-[2.5rem] border border-slate-100 opacity-60 hover:opacity-100 grayscale hover:grayscale-0 transition-all">
                                <div className="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center text-slate-300 font-black text-2xl mb-6 shadow-sm">{(emp.name || 'E')[0]}</div>
                                <h3 className="text-xl font-black text-slate-500 mb-6">{emp.name}</h3>
                                <div className="grid grid-cols-2 gap-4 border-t border-slate-50 pt-6"><div><p className="text-[10px] font-black uppercase text-slate-400 mb-1">Clients</p><p className="text-xl font-black text-slate-500">{emp.customersManaged || 0}</p></div><div><p className="text-[10px] font-black uppercase text-slate-400 mb-1">Career Rev</p><p className="text-xl font-black text-slate-500">₹{(Number(emp.totalRevenue) || 0).toLocaleString()}</p></div></div>
                                <button onClick={() => restoreEmployee(emp.id)} className="w-full mt-6 py-4 border-2 border-purple-100 text-purple-600 rounded-2xl font-black text-sm hover:bg-purple-50 transition-all flex justify-center items-center gap-2"><Icon name="RotateCcw" size={16}/> Reinstate Staff</button>
                            </div>
                        ))}
                        {deletedStaff.length === 0 && <div className="col-span-full py-32 text-center bg-white rounded-[3rem] border-4 border-dashed border-slate-100"><Icon name="Trash2" size={64} className="mx-auto mb-6 text-slate-200" /><p className="text-slate-400 font-black uppercase tracking-widest">No inactive records found</p></div>}
                    </div>
                </div>
            );
        };

        const Toast = ({ message }) => (
            <div className="fixed bottom-10 right-10 bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl font-black flex items-center gap-3 animate-in slide-in-from-bottom-5 z-[200]">
                <Icon name="CheckCircle2" className="text-emerald-400" /> {message}
            </div>
        );

        // --- PRINT STYLES BILL RECEIPT VIEW ---
        const ReceiptModal = ({ bill, salonInfo, employees, onClose }) => {
            const stylistName = employees.find(e => e.id === bill.employeeId)?.name || 'Admin';

            useEffect(() => {
                const printRoot = document.getElementById('print-root');
                if (printRoot) {
                    printRoot.innerHTML = `
                        <div style="font-family: monospace; max-width: 320px; margin: 0 auto; padding: 20px 10px; color: #000; background: #fff;">
                            <div style="text-align: center; margin-bottom: 15px;">
                                ${salonInfo.logoUrl ? `<img src="${salonInfo.logoUrl}" style="max-height: 50px; margin-bottom: 5px;" />` : ''}
                                <h2 style="margin: 0; font-size: 20px; text-transform: uppercase; font-weight: bold; letter-spacing: -1px;">${salonInfo.name || 'SALON'}</h2>
                                <p style="margin: 3px 0; font-size: 11px; font-weight: bold;">${salonInfo.address || ''}</p>
                                <p style="margin: 3px 0; font-size: 11px;">Mob: ${salonInfo.mobile || ''}</p>
                                ${salonInfo.gst ? `<p style="margin: 3px 0; font-size: 11px;">GST: ${salonInfo.gst}</p>` : ''}
                            </div>
                            <div style="border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 8px 0; margin-bottom: 12px; font-size: 12px; line-height: 1.4;">
                                <div><strong>Invoice:</strong> ${bill.invoiceNo}</div>
                                <div><strong>Date:</strong> ${bill.dateString}</div>
                                <div><strong>Client:</strong> ${bill.customerName || 'Walk-in'}</div>
                                ${bill.customerPhone ? `<div><strong>Phone:</strong> ${bill.customerPhone}</div>` : ''}
                                <div><strong>Stylist:</strong> ${stylistName}</div>
                            </div>
                            <table style="width: 100%; font-size: 12px; border-collapse: collapse; margin-bottom: 12px;">
                                <thead>
                                    <tr style="border-bottom: 1px dashed #000;">
                                        <th style="text-align: left; padding-bottom: 5px;">Service</th>
                                        <th style="text-align: right; padding-bottom: 5px;">Price</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${bill.selectedServices.map(s => `
                                        <tr>
                                            <td style="padding: 4px 0;">${s.name}</td>
                                            <td style="text-align: right; padding: 4px 0;">₹${Number(s.price).toFixed(2)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                            <div style="border-top: 1px dashed #000; padding-top: 8px; font-size: 12px; line-height: 1.5;">
                                <div style="display: flex; justify-content: space-between;">
                                    <span>Subtotal:</span>
                                    <span>₹${Number(bill.subtotal).toFixed(2)}</span>
                                </div>
                                ${bill.taxType === 'WITH_GST' ? `
                                    <div style="display: flex; justify-content: space-between;">
                                        <span>GST (${bill.customGstPercent || 18}%):</span>
                                        <span>₹${Number(bill.tax).toFixed(2)}</span>
                                    </div>
                                ` : ''}
                                <div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: bold; border-top: 1px double #000; padding-top: 5px; margin-top: 5px;">
                                    <span>TOTAL:</span>
                                    <span>₹${Number(bill.total).toFixed(2)}</span>
                                </div>
                            </div>
                            <div style="text-align: center; margin-top: 25px; font-size: 11px; border-top: 1px dashed #000; padding-top: 10px;">
                                <p style="margin: 0; font-weight: bold;">Thank You For Your Visit!</p>
                                <p style="margin: 3px 0 0 0; color: #555;">Powered by Salon Manager Pro</p>
                            </div>
                        </div>
                    `;
                }
                return () => {
                    const printRoot = document.getElementById('print-root');
                    if (printRoot) printRoot.innerHTML = '';
                };
            }, [bill, salonInfo, stylistName]);

            const triggerSystemPrint = () => {
                window.print();
            };

            const triggerWhatsAppShare = () => {
                let msg = `*INVOICE: ${bill.invoiceNo}*\n`;
                msg += `*${salonInfo.name || 'Salon'}*\n`;
                msg += `Date: ${bill.dateString}\n`;
                msg += `Client: ${bill.customerName || 'Walk-in'}\n\n`;
                msg += `*Services:*\n`;
                bill.selectedServices.forEach(s => {
                    msg += `- ${s.name}: ₹${Number(s.price).toFixed(2)}\n`;
                });
                msg += `\nSubtotal: ₹${Number(bill.subtotal).toFixed(2)}\n`;
                if (bill.taxType === 'WITH_GST') {
                    msg += `GST (${bill.customGstPercent}%): ₹${Number(bill.tax).toFixed(2)}\n`;
                }
                msg += `*Grand Total: ₹${Number(bill.total).toFixed(2)}*\n\n`;
                msg += `Thank you for your visit! ✨`;

                const phone = bill.customerPhone ? bill.customerPhone.replace(/\D/g, '') : '';
                const url = `https://web.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(msg)}`;
                window.open(url, '_blank');
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] flex items-center justify-center p-4 overflow-y-auto fade-in no-print">
                    <div className="bg-white rounded-[2.5rem] w-full max-w-md shadow-2xl p-8 overflow-hidden relative border border-slate-100 flex flex-col">
                        <div className="flex justify-between items-center pb-4 border-b border-slate-100 mb-6">
                            <div>
                                <h3 className="font-black text-slate-800 text-lg uppercase tracking-tight">Receipt Generated</h3>
                                <p className="text-xs font-bold text-slate-400 mt-1">{bill.invoiceNo}</p>
                            </div>
                            <button onClick={onClose} className="p-3 bg-slate-50 text-slate-400 hover:text-red-500 rounded-xl transition-colors"><Icon name="X" size={18} /></button>
                        </div>

                        <div className="bg-slate-50 rounded-2xl p-6 border border-slate-100 max-h-[350px] overflow-y-auto custom-scrollbar mb-6 font-mono text-sm text-slate-700">
                            <div className="text-center pb-4 border-b border-dashed border-slate-200 mb-4">
                                <h4 className="font-black text-slate-800 text-base uppercase">{salonInfo.name || 'Salon'}</h4>
                                <p className="text-[10px] text-slate-400 font-bold mt-1 uppercase tracking-widest">{salonInfo.address || 'Salon Location'}</p>
                            </div>
                            <div className="space-y-2 text-xs font-bold text-slate-500 pb-4 border-b border-dashed border-slate-200 mb-4">
                                <div className="flex justify-between"><span>Invoice:</span><span className="text-slate-800">{bill.invoiceNo}</span></div>
                                <div className="flex justify-between"><span>Date:</span><span className="text-slate-800">{bill.dateString}</span></div>
                                <div className="flex justify-between"><span>Client:</span><span className="text-slate-800">{bill.customerName || 'Walk-in'}</span></div>
                                <div className="flex justify-between"><span>Stylist:</span><span className="text-slate-800">{stylistName}</span></div>
                            </div>
                            <div className="space-y-3 mb-4">
                                {bill.selectedServices.map((s, idx) => (
                                    <div key={idx} className="flex justify-between font-bold">
                                        <span>{s.name}</span>
                                        <span>₹{Number(s.price).toFixed(2)}</span>
                                    </div>
                                ))}
                            </div>
                            <div className="border-t border-dashed border-slate-200 pt-4 space-y-2 text-xs font-bold text-slate-500">
                                <div className="flex justify-between"><span>Subtotal:</span><span className="text-slate-800">₹{Number(bill.subtotal).toFixed(2)}</span></div>
                                {bill.taxType === 'WITH_GST' && (
                                    <div className="flex justify-between"><span>GST ({bill.customGstPercent}%):</span><span className="text-slate-800">₹{Number(bill.tax).toFixed(2)}</span></div>
                                )}
                                <div className="flex justify-between text-base font-black text-purple-600 pt-2 border-t border-slate-200">
                                    <span>Grand Total:</span>
                                    <span>₹{Number(bill.total).toFixed(2)}</span>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                            <button onClick={triggerSystemPrint} className="bg-slate-900 text-white py-4 rounded-xl font-black text-sm hover:bg-slate-800 transition-all flex items-center justify-center gap-2 shadow-lg"><Icon name="Printer" size={16} /> Print Bill</button>
                            <button onClick={triggerWhatsAppShare} className="bg-emerald-600 text-white py-4 rounded-xl font-black text-sm hover:bg-emerald-500 transition-all flex items-center justify-center gap-2 shadow-lg"><Icon name="Send" size={16} /> WhatsApp Share</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- ROOT APPLICATION ---
        const App = () => {
            const [dbData, setDbData] = useState(() => {
                let raw = localStorage.getItem('salon_local_db_v1');
                if (!raw) return { users: {} };
                try {
                    let data = JSON.parse(raw);
                    if (data.bills || data.employees) {
                        const firstUser = Object.keys(data.users)[0] || 'admin';
                        if (!data.users[firstUser]) data.users[firstUser] = { password: '123', secretKey: '123', createdAt: Date.now() };
                        data.users[firstUser].profile = data.profile || {};
                        data.users[firstUser].employees = data.employees || [];
                        data.users[firstUser].services = data.services || [];
                        data.users[firstUser].bills = data.bills || [];
                        delete data.profile; delete data.employees; delete data.services; delete data.bills;
                        localStorage.setItem('salon_local_db_v1', JSON.stringify(data));
                    }
                    return data;
                } catch (e) { return { users: {} }; }
            });

            useEffect(() => { localStorage.setItem('salon_local_db_v1', JSON.stringify(dbData)); }, [dbData]);

            const [currentUser, setCurrentUser] = useState(() => localStorage.getItem('salon_current_user') || null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [authMode, setAuthMode] = useState('login');
            const [authError, setAuthError] = useState('');
            const [currentInvoice, setCurrentInvoice] = useState(null);
            const [editingBill, setEditingBill] = useState(null);
            const [toastMsg, setToastMsg] = useState('');
            const [backupDue, setBackupDue] = useState(false);

            // In-app Alert & Confirmation overlay states
            const [confirmState, setConfirmState] = useState(null); // { message, action }
            const [alertState, setAlertState] = useState(null); // { message }

            useEffect(() => {
                if (currentUser) localStorage.setItem('salon_current_user', currentUser);
                else localStorage.removeItem('salon_current_user');
            }, [currentUser]);

            const userData = currentUser ? (dbData.users[currentUser] || {}) : {};
            const profile = userData.profile || { name: '', mobile: '', gst: '', address: '', defaultGstPercent: 18, logoUrl: '', slideshowImages: [] };
            const employees = userData.employees || [];
            const services = userData.services || [];
            const bills = userData.bills || [];

            useEffect(() => {
                if (currentUser && profile) {
                    const lastBackup = profile.lastBackupDate;
                    if (!lastBackup) {
                        updateUserData({ profile: { ...profile, lastBackupDate: Date.now() } });
                    } else if (Date.now() - lastBackup >= 10 * 24 * 60 * 60 * 1000) {
                        setBackupDue(true);
                    }
                }
            }, [currentUser]);

            const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 3000); };
            const triggerAlert = (message) => setAlertState({ message });
            const triggerConfirm = (message, action) => setConfirmState({ message, action });

            const updateUserData = (updates) => {
                setDbData(prev => {
                    const current = prev.users[currentUser] || {};
                    return { ...prev, users: { ...prev.users, [currentUser]: { ...current, ...updates } } };
                });
            };

            const handleLogin = (u, p) => {
                setAuthError(''); const username = u.toLowerCase(); const user = dbData.users[username];
                if (user && user.password === p) setCurrentUser(username);
                else setAuthError('Invalid credentials or account does not exist.');
            };

            const handleSignup = (u, p, s, l) => {
                setAuthError(''); const username = u.toLowerCase();
                if (dbData.users[username]) return setAuthError('Username already taken.');
                setDbData(prev => {
                    const nextDb = { ...prev, users: { ...prev.users, [username]: { password: p, secretKey: s, createdAt: Date.now(), profile: { name: username, logoUrl: l } } } };
                    return nextDb;
                });
                setCurrentUser(username);
            };

            const addEmployee = (name, phone) => {
                const newEmp = { id: Date.now().toString(), name, phone, status: 'active', customersManaged: 0, totalRevenue: 0, createdAt: Date.now() };
                updateUserData({ employees: [...employees, newEmp] });
                showToast("Staff Member Enrolled");
            };
            const updateEmployee = (id, newName, newPhone) => { updateUserData({ employees: employees.map(e => e.id === id ? { ...e, name: newName, phone: newPhone } : e) }); showToast("Staff Updated"); };
            const deleteEmployee = (id) => { updateUserData({ employees: employees.map(e => e.id === id ? { ...e, status: 'deleted' } : e) }); showToast("Moved to Trash"); };
            const restoreEmployee = (id) => { updateUserData({ employees: employees.map(e => e.id === id ? { ...e, status: 'active' } : e) }); showToast("Staff Restored"); };

            const addService = (name, price) => {
                const newSvc = { id: Date.now().toString(), name, price: Number(price) };
                updateUserData({ services: [...services, newSvc] });
                showToast("Service Added");
            };
            const updateService = (id, newName, newPrice) => { updateUserData({ services: services.map(s => s.id === id ? { ...s, name: newName, price: Number(newPrice) } : s) }); showToast("Service Updated"); };
            const deleteService = (id) => { updateUserData({ services: services.filter(s => s.id !== id) }); showToast("Service Deleted"); };

            const generateInvoiceNo = () => {
                const today = new Date();
                const ddmmyy = String(today.getDate()).padStart(2, '0') + String(today.getMonth() + 1).padStart(2, '0') + String(today.getFullYear()).slice(-2);
                const prefix = `INV-${ddmmyy}-`;
                const todaysBills = bills.filter(b => b.invoiceNo && b.invoiceNo.startsWith(prefix));
                return `${prefix}${String(todaysBills.length + 1).padStart(3, '0')}`;
            };

            const createBill = (data) => {
                const now = new Date();
                const bill = { 
                    ...data, id: Date.now().toString(), timestamp: now.getTime(), 
                    dateString: now.toLocaleString('en-US', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }), 
                    invoiceNo: generateInvoiceNo(), billedBy: currentUser 
                };
                updateUserData({
                    bills: [bill, ...bills],
                    employees: employees.map(e => e.id === data.employeeId ? { ...e, customersManaged: (e.customersManaged || 0) + 1, totalRevenue: (e.totalRevenue || 0) + data.total } : e)
                });
                setCurrentInvoice(bill);
            };

            const updateBill = (oldBill, updatedData) => {
                const subtotal = updatedData.selectedServices.reduce((acc, curr) => acc + (Number(curr.price) || 0), 0);
                const tax = updatedData.taxType === 'WITH_GST' ? subtotal * (Number(updatedData.customGstPercent) / 100) : 0;
                const total = subtotal + tax;
                const newBill = { ...oldBill, ...updatedData, subtotal, tax, total };

                let nextEmployees = [...employees];
                const oldEmpIdx = nextEmployees.findIndex(e => e.id === oldBill.employeeId);
                if (oldEmpIdx > -1) {
                    nextEmployees[oldEmpIdx] = { ...nextEmployees[oldEmpIdx], customersManaged: Math.max(0, (nextEmployees[oldEmpIdx].customersManaged || 1) - 1), totalRevenue: Math.max(0, (nextEmployees[oldEmpIdx].totalRevenue || 0) - oldBill.total) };
                }
                const newEmpIdx = nextEmployees.findIndex(e => e.id === newBill.employeeId);
                if (newEmpIdx > -1) {
                    nextEmployees[newEmpIdx] = { ...nextEmployees[newEmpIdx], customersManaged: (nextEmployees[newEmpIdx].customersManaged || 0) + 1, totalRevenue: (nextEmployees[newEmpIdx].totalRevenue || 0) + newBill.total };
                }
                updateUserData({ employees: nextEmployees, bills: bills.map(b => b.id === oldBill.id ? newBill : b) });
                showToast("Bill Updated & Recalculated");
            };

            const deleteBill = (id) => {
                const bill = bills.find(b => b.id === id);
                if (!bill) return;
                updateUserData({
                    employees: employees.map(e => e.id === bill.employeeId ? { ...e, customersManaged: Math.max(0, (e.customersManaged || 1) - 1), totalRevenue: Math.max(0, (e.totalRevenue || 0) - bill.total) } : e),
                    bills: bills.filter(b => b.id !== id)
                });
                showToast("Bill Permanently Deleted");
            };

            const saveProfile = (newProfile) => { updateUserData({ profile: newProfile }); showToast("Profile Settings Saved"); };

            const exportDbData = () => {
                const exportObj = { _version: 2, _username: currentUser, ...userData };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj));
                const dl = document.createElement('a');
                dl.setAttribute("href", dataStr);
                dl.setAttribute("download", `salon_${currentUser}_backup_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(dl); dl.click(); document.body.removeChild(dl);
                
                updateUserData({ profile: { ...profile, lastBackupDate: Date.now() } });
                setBackupDue(false);
                showToast("Encrypted Backup Downloaded");
            };

            const importDbData = (parsedData) => {
                let success = false;
                if (parsedData._username) {
                    setDbData(prev => ({ ...prev, users: { ...prev.users, [parsedData._username]: parsedData } }));
                    showToast("Shop Backup Restored!");
                    success = true;
                } else if (parsedData.users) {
                    setDbData(parsedData); 
                    showToast("Full Master Database Restored!");
                    success = true;
                } else if (parsedData.profile || parsedData.bills || parsedData.employees) {
                    const target = currentUser || 'admin';
                    setDbData(prev => {
                        const current = prev.users[target] || { password: '123', secretKey: '123', createdAt: Date.now() };
                        return { ...prev, users: { ...prev.users, [target]: { ...current, profile: parsedData.profile || current.profile || {}, employees: parsedData.employees || current.employees || [], services: parsedData.services || current.services || [], bills: parsedData.bills || current.bills || [] } } };
                    });
                    showToast("Legacy Backup Restored!");
                    success = true;
                }
                return success;
            };

            const resetDatabase = () => {
                updateUserData({ bills: [], employees: employees.map(e => ({...e, customersManaged: 0, totalRevenue: 0})) });
                showToast("System Reset Complete.");
            };

            if (!currentUser) return <AuthScreen authMode={authMode} setAuthMode={setAuthMode} authError={authError} handleLogin={handleLogin} handleSignup={handleSignup} importDbData={importDbData} />;

            return (
                <div className="min-h-screen bg-slate-50 flex">
                    {toastMsg && <Toast message={toastMsg} />}

                    {/* Clean Alert Overlay */}
                    {alertState && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-3xl p-6 shadow-2xl max-w-sm w-full text-center border border-slate-100">
                                <div className="w-14 h-14 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="AlertCircle" size={28} /></div>
                                <h3 className="font-black text-slate-900 text-lg mb-2">Notification</h3>
                                <p className="text-slate-500 text-xs font-semibold mb-6 leading-relaxed">{alertState.message}</p>
                                <button onClick={() => setAlertState(null)} className="w-full py-3.5 bg-slate-950 text-white rounded-xl font-black hover:bg-slate-800 transition-colors">Acknowledge</button>
                            </div>
                        </div>
                    )}

                    {/* Clean Confirm Overlay */}
                    {confirmState && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-3xl p-6 shadow-2xl max-w-sm w-full text-center border border-slate-100">
                                <div className="w-14 h-14 bg-purple-50 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="HelpCircle" size={28} /></div>
                                <h3 className="font-black text-slate-900 text-lg mb-2">Are you sure?</h3>
                                <p className="text-slate-500 text-xs font-semibold mb-6 leading-relaxed">{confirmState.message}</p>
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => setConfirmState(null)} className="py-3 bg-slate-100 text-slate-700 rounded-xl font-black hover:bg-slate-200 transition-colors text-xs">Cancel</button>
                                    <button onClick={() => { confirmState.action(); setConfirmState(null); }} className="py-3 bg-purple-600 text-white rounded-xl font-black hover:bg-purple-700 transition-colors text-xs">Confirm</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {}
                    <div className="w-64 bg-slate-900 h-screen text-white fixed left-0 top-0 flex flex-col p-4 shadow-xl z-20 no-print">
                        <div className="flex items-center gap-3 mb-10 px-2 pt-4">
                            <div className="bg-purple-600 p-2 rounded-lg shrink-0 shadow-lg overflow-hidden flex items-center justify-center w-10 h-10">
                                {profile.logoUrl ? <img src={profile.logoUrl} className="w-full h-full object-contain" /> : <Icon name="Scissors" className="text-white" />}
                            </div>
                            <div className="overflow-hidden">
                                <h1 className="font-bold text-lg truncate leading-tight">{profile.name || 'Salon Manager'}</h1>
                                <p className="text-[10px] text-emerald-400 uppercase tracking-widest font-black">Logged: {currentUser}</p>
                            </div>
                        </div>
                        <nav className="flex-1 space-y-1">
                            {['dashboard', 'billing', 'invoices', 'history', 'campaigns', 'employees', 'services', 'trash', 'settings'].map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activeTab === tab ? 'bg-purple-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800'}`}>
                                    <Icon name={tab === 'dashboard' ? 'TrendingUp' : tab === 'billing' ? 'ReceiptText' : tab === 'invoices' ? 'FileSpreadsheet' : tab === 'campaigns' ? 'MessageCircle' : tab === 'employees' ? 'Users' : tab === 'services' ? 'Scissors' : tab === 'history' ? 'History' : tab === 'trash' ? 'Trash2' : 'Settings'} />
                                    <span className="capitalize font-medium text-xs">{tab === 'invoices' ? 'Old Bills' : tab}</span>
                                </button>
                            ))}
                        </nav>
                        
                        <div className="mt-auto space-y-2 border-t border-slate-800 pt-4">
                            <button onClick={() => showToast("All data is securely saved!")} className="w-full flex items-center justify-center gap-3 px-4 py-3 rounded-xl text-emerald-400 border border-emerald-500/20 bg-emerald-500/10 hover:bg-emerald-500/20 transition-all font-bold text-xs"><Icon name="Save" size={14} /> Save Data</button>
                            <button onClick={() => setCurrentUser(null)} className="w-full flex items-center justify-center gap-3 px-4 py-3 rounded-xl text-red-400 hover:bg-red-500/10 transition-all text-xs font-black"><Icon name="LogOut" size={14} /> Log Out</button>
                        </div>
                    </div>

                    {}
                    <main className="flex-1 ml-64 p-12 pb-32 relative">
                        {currentInvoice && <ReceiptModal bill={currentInvoice} salonInfo={profile} employees={employees} onClose={() => setCurrentInvoice(null)} />}
                        {editingBill && <EditBillModal bill={editingBill} employees={employees} services={services} onClose={() => setEditingBill(null)} onSave={(oldBill, newForm) => { updateBill(oldBill, newForm); setEditingBill(null); }} triggerAlert={triggerAlert} />}
                        
                        {backupDue && (
                            <div className="bg-blue-50 border border-blue-200 p-6 rounded-[2rem] mb-8 flex flex-col xl:flex-row justify-between items-center gap-6 animate-in slide-in-from-top-4 shadow-sm no-print">
                                <div className="flex items-center gap-5">
                                    <div className="bg-blue-600 p-4 rounded-2xl text-white shadow-lg"><Icon name="Database" size={24} /></div>
                                    <div><h3 className="text-blue-900 font-black text-lg uppercase tracking-tight">Scheduled Backup Due</h3><p className="text-blue-600 text-xs font-bold mt-1 uppercase tracking-widest">It has been 10+ days since your last backup.</p></div>
                                </div>
                                <div className="flex items-center gap-4 w-full xl:w-auto">
                                    <button onClick={() => setBackupDue(false)} className="px-6 py-4 text-xs font-black text-blue-500 hover:text-blue-700 uppercase tracking-widest">Remind Later</button>
                                    <button onClick={exportDbData} className="px-8 py-4 bg-blue-600 text-white rounded-2xl font-black text-sm hover:bg-blue-500 shadow-xl transition-all flex items-center justify-center gap-2 w-full xl:w-auto"><Icon name="Download" size={18} /> Download Backup</button>
                                </div>
                            </div>
                        )}

                        <header className="flex justify-between items-center mb-16 no-print">
                            <div><h1 className="text-5xl font-black text-slate-900 tracking-tighter capitalize">{activeTab === 'invoices' ? 'Old Bills' : activeTab}</h1><p className="text-slate-400 font-black mt-2 text-[10px] tracking-widest uppercase opacity-70">Terminal Active • {new Date().toLocaleDateString()}</p></div>
                            <div className="w-16 h-16 rounded-3xl bg-white shadow-2xl border border-slate-100 flex items-center justify-center text-slate-900"><Icon name="UserCheck" size={32} /></div>
                        </header>

                        {}
                        {activeTab === 'dashboard' && <DashboardView bills={bills} employees={employees} salonInfo={profile} />}
                        {activeTab === 'billing' && <BillingView employees={employees} services={services} createBill={createBill} salonInfo={profile} currentUser={currentUser} triggerAlert={triggerAlert} />}
                        {activeTab === 'invoices' && <InvoicesView bills={bills} employees={employees} services={services} setCurrentInvoice={setCurrentInvoice} setEditingBill={setEditingBill} triggerConfirm={triggerConfirm} deleteBill={deleteBill} />}
                        {activeTab === 'history' && <HistoryView bills={bills} employees={employees} services={services} triggerAlert={triggerAlert} />}
                        {activeTab === 'campaigns' && <CampaignsView salonInfo={profile} triggerAlert={triggerAlert} />}
                        {activeTab === 'employees' && <EmployeesView employees={employees} addEmployee={addEmployee} updateEmployee={updateEmployee} deleteEmployee={deleteEmployee} triggerConfirm={triggerConfirm} />}
                        {activeTab === 'services' && <ServicesView services={services} addService={addService} updateService={updateService} deleteService={deleteService} triggerConfirm={triggerConfirm} />}
                        {activeTab === 'trash' && <TrashView employees={employees} restoreEmployee={restoreEmployee} />}
                        {activeTab === 'settings' && <SettingsView salonInfo={profile} handleSaveSalon={saveProfile} exportDbData={exportDbData} triggerConfirm={triggerConfirm} resetDatabase={resetDatabase} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
